<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2026 Sirens Member Survey</title>
    <meta name="description" content="Annual San Diego Sirens member survey." />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="progress" role="status">
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
      <span id="progress-text" class="progress-text"></span>
    </div>

    <main class="page">
      <header class="masthead">
        <img class="crest" src="assets/sirens-crest.webp" alt="San Diego Sirens crest" />
        <h1 id="title"></h1>
      </header>
      <span class="wave-rule" aria-hidden="true">
        <svg viewBox="0 0 400 28" preserveAspectRatio="none">
          <path d="M0 14 Q 25 2, 50 14 T 100 14 T 150 14 T 200 14 T 250 14 T 300 14 T 350 14 T 400 14" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </span>
      <div id="intro" class="intro"></div>

      <form id="survey" novalidate>
        <div class="submit-row">
          <p id="submit-error" class="submit-error" role="alert"></p>
          <button type="submit" class="btn btn-primary">Submit survey</button>
        </div>
      </form>

      <section id="done" class="done" hidden tabindex="-1">
        <h2>Thank you!</h2>
        <p>Your response has been recorded in this browser. Responses aren't sent anywhere yet, so please copy or download it below.</p>
        <div class="done-actions">
          <button type="button" id="copy" class="btn btn-ghost">Copy response</button>
          <a id="download" class="btn btn-ghost" download="sirens-2026-response.json">Download JSON</a>
        </div>
        <pre id="response-json" class="response-json"></pre>
      </section>

      <footer class="foot">
        San Diego Sirens · Est. 2022 ·
        <a href="mailto:contact@sandiegosirens.com">contact@sandiegosirens.com</a>
      </footer>
    </main>

    <script src="survey.js"></script>
    <script src="app.js"></script>
  </body>
</html>
